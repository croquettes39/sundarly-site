<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modifier mon annonce – Sundarly</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#D81B60">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261112a">
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/assets/stats.js?v=20261108a"></script>
</head>
<body class="page-editeur">

<header class="entete-editeur">
  <a class="rond-retour" href="espace-hote.html" aria-label="Retour à mon espace">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </a>
  <h1>Outil de modification d'annonce</h1>
  <span class="espaceur"></span>
</header>

<div class="onglets onglets-editeur" role="tablist" aria-label="Rubriques">
  <button type="button" role="tab" aria-selected="true" data-vue="logement">Mon logement</button>
  <button type="button" role="tab" aria-selected="false" data-vue="guide">Guide d'arrivée</button>
</div>

<main class="editeur">
  <p class="chargement" id="chargement">Chargement de votre annonce…</p>

  <div id="contenu" hidden>
    <div class="statut-annonce" id="statut-annonce"></div>

    <section id="vue-logement" class="liste-cartes"></section>

    <section id="vue-guide" class="liste-cartes" hidden>
      <p class="note-securite"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg><span>Le guide d'arrivée reste privé. Il est envoyé uniquement aux voyageurs ayant une réservation confirmée et payée, quelques jours avant leur arrivée.</span></p>
      <div id="cartes-guide"></div>
    </section>
  </div>
</main>

<button type="button" class="btn-apercu" id="btn-apercu" hidden>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  Aperçu
</button>

<!-- Panneau de modification -->
<div class="panneau" id="panneau" hidden role="dialog" aria-modal="true" aria-labelledby="panneau-titre">
  <div class="panneau-boite">
    <div class="panneau-haut">
      <button type="button" class="rond-retour" data-fermer aria-label="Fermer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <form id="panneau-form" novalidate>
      <h2 id="panneau-titre"></h2>
      <div id="panneau-corps"></div>
      <p class="message" role="status" aria-live="polite"></p>
    </form>
    <div class="panneau-bas">
      <button type="button" class="lien-discret" data-fermer>Annuler</button>
      <button type="submit" form="panneau-form" class="btn btn-sombre" id="btn-enregistrer">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Aperçu côté voyageur -->
<div class="apercu" id="apercu" hidden role="dialog" aria-modal="true" aria-label="Aperçu de l'annonce">
  <div class="apercu-haut">
    <button type="button" class="rond-retour" id="fermer-apercu" aria-label="Fermer l'aperçu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <span>Aperçu : voici ce que verront les voyageurs</span>
  </div>
  <div class="apercu-corps" id="apercu-corps"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/devise.js?v=20261108a"></script>
<script src="assets/config.js?v=20261108a"></script>
<script src="assets/auth.js?v=20261109a"></script>
<script src="assets/annonce.js?v=20261108a"></script>
</body>
</html>
