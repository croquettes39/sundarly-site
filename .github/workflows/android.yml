name: Application Android

on:
  push:
    branches: [app-android, main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier l'APK d'essai dans les « Releases » du dépôt"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Compiler l'application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUNDARLY_VERSION_CODE: ${{ github.run_number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests et compilation
        id: gradle
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain testDebugUnitTest assembleRelease 2>&1 | tee ../compilation.log
      - name: Résultats (journal)
        if: always()
        run: |
          mkdir -p resultats
          { echo "commit: $GITHUB_SHA"; echo "run: $GITHUB_RUN_ID (n° $GITHUB_RUN_NUMBER)"; echo "etat: ${{ steps.gradle.outcome }}"; date -u; } > resultats/etat.txt
          grep -n -E "^e: |^w: .*(deprecated|unused)|error:|FAILED|Exception|What went wrong|BUILD|> Task .*(FAILED)|tests completed|AAPT|Could not" compilation.log | head -300 > resultats/erreurs.txt || true
          tail -n 150 compilation.log > resultats/fin-du-journal.txt || true
          mkdir -p resultats/tests && cp -r android/app/build/test-results/testDebugUnitTest/*.xml resultats/tests/ 2>/dev/null || true
          ls -la android/app/build/outputs/apk/release/ >> resultats/etat.txt 2>/dev/null || true
          rm -rf resultats/captures
          bash android/ci/publier-resultats.sh resultats "Compilation n° $GITHUB_RUN_NUMBER : ${{ steps.gradle.outcome }}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sundarly-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  captures:
    name: Essai dans un téléphone virtuel
    needs: compiler
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sundarly-apk, path: apk }
      - name: Accélération matérielle
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/ci/captures.sh apk/*.apk
      - name: Résultats (captures)
        if: always()
        run: |
          mkdir -p resultats
          echo "captures du commit $GITHUB_SHA (run $GITHUB_RUN_NUMBER)" > resultats/captures.txt
          bash android/ci/publier-resultats.sh resultats "Captures n° $GITHUB_RUN_NUMBER"

  publier:
    name: Publier l'APK d'essai
    needs: [compiler, captures]
    if: github.event_name == 'workflow_dispatch' && inputs.publier
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: sundarly-apk, path: apk }
      - run: |
          mv apk/*.apk sundarly.apk
          gh release delete android-essai --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create android-essai sundarly.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Sundarly pour Android – version d'essai n° $GITHUB_RUN_NUMBER" \
            --notes "Version d'essai de l'application Android. Téléchargez « sundarly.apk » sur un téléphone Android puis ouvrez le fichier pour l'installer."
